<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مشغل القرآن</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="container header-content">

            <div class="brand">
                <div class="brand-icon">☪</div>

                <div>
                    <h1>مشغل القرآن</h1>
                    <span>استمع إلى القرآن الكريم</span>
                </div>
            </div>

            <button
                id="themeBtn"
                class="theme-button"
                type="button"
                aria-label="تغيير المظهر"
            >
                🌙
            </button>

        </div>

    </header>


    <!-- =========================
         HERO
    ========================== -->

    <main>

        <section class="hero">

            <div class="container">

                <div class="hero-content">

                    <div class="hero-icon">
                        📖
                    </div>

                    <h2>القرآن الكريم</h2>

                    <p>
                        استمع إلى كتاب الله الكريم بصوت القراء المفضلين لديك
                    </p>

                </div>

            </div>

        </section>


        <!-- =========================
             SELECTORS
        ========================== -->

        <section class="selectors-section">

            <div class="container">

                <div class="selectors-card">

                    <!-- RECITER -->

                    <div class="selector-group">

                        <label for="reciterSearch">
                            القارئ
                        </label>

                        <div class="search-select">

                            <input
                                id="reciterSearch"
                                type="text"
                                autocomplete="off"
                                placeholder="ابحث عن قارئ..."
                                aria-label="البحث عن قارئ"
                            >

                            <button
                                id="reciterArrow"
                                class="search-arrow"
                                type="button"
                                aria-label="عرض القراء"
                            >
                                ▾
                            </button>

                            <div
                                id="reciterResults"
                                class="search-results"
                            ></div>

                        </div>

                    </div>


                    <!-- SURAH -->

                    <div class="selector-group">

                        <label for="surahSearch">
                            السورة
                        </label>

                        <div class="search-select">

                            <input
                                id="surahSearch"
                                type="text"
                                autocomplete="off"
                                placeholder="ابحث عن سورة..."
                                aria-label="البحث عن سورة"
                            >

                            <button
                                id="surahArrow"
                                class="search-arrow"
                                type="button"
                                aria-label="عرض السور"
                            >
                                ▾
                            </button>

                            <div
                                id="surahResults"
                                class="search-results"
                            ></div>

                        </div>

                    </div>


                    <!-- OPEN SURAH -->

                    <div class="selector-action">

                        <button
                            id="openSurahBtn"
                            class="primary-button"
                            type="button"
                        >
                            فتح السورة
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             PLAYER
        ========================== -->

        <section class="player-section">

            <div class="container">

                <div class="player-card">

                    <div class="player-info">

                        <div>

                            <span class="player-label">
                                السورة الحالية
                            </span>

                            <h3 id="currentSurah">
                                -
                            </h3>

                        </div>

                        <div class="reciter-info">

                            <span class="player-label">
                                القارئ
                            </span>

                            <span id="currentReciter">
                                -
                            </span>

                        </div>

                    </div>


                    <!-- CURRENT AYAH -->

                    <div class="current-ayah">

                        <span>
                            الآية الحالية
                        </span>

                        <strong id="currentAyah">
                            -
                        </strong>

                    </div>


                    <!-- AUDIO -->

                    <audio
                        id="audio"
                        preload="metadata"
                    ></audio>


                    <!-- PROGRESS -->

                    <div class="progress-area">

                        <span id="currentTime">
                            00:00
                        </span>

                        <input
                            id="progress"
                            type="range"
                            min="0"
                            max="100"
                            value="0"
                            step="0.1"
                        >

                        <span id="duration">
                            00:00
                        </span>

                    </div>


                    <!-- MAIN CONTROLS -->

                    <div class="main-controls">

                        <button
                            id="previousBtn"
                            class="control-button"
                            type="button"
                            aria-label="السورة السابقة"
                        >
                            ⏮
                        </button>

                        <button
                            id="playBtn"
                            class="play-button"
                            type="button"
                            aria-label="تشغيل"
                        >
                            ▶
                        </button>

                        <button
                            id="nextBtn"
                            class="control-button"
                            type="button"
                            aria-label="السورة التالية"
                        >
                            ⏭
                        </button>

                    </div>


                    <!-- SECONDARY CONTROLS -->

                    <div class="secondary-controls">

                        <button
                            id="autoNextBtn"
                            class="option-button"
                            type="button"
                        >
                            ⏭️
                            <span>
                                التالي تلقائيًا: إيقاف
                            </span>
                        </button>


                        <button
                            id="repeatSurahBtn"
                            class="option-button"
                            type="button"
                        >
                            🔂
                            <span>
                                تكرار السورة: إيقاف
                            </span>
                        </button>


                        <button
                            id="muteBtn"
                            class="option-button"
                            type="button"
                        >
                            🔊
                            <span>
                                كتم الصوت
                            </span>
                        </button>


                        <div class="volume-control">

                            <span>
                                🔈
                            </span>

                            <input
                                id="volume"
                                type="range"
                                min="0"
                                max="1"
                                value="1"
                                step="0.01"
                                aria-label="مستوى الصوت"
                            >

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             QURAN
        ========================== -->

        <section class="quran-section">

            <div class="container">

                <div class="quran-card">

                    <div class="quran-header">

                        <div>

                            <span class="section-label">
                                سورة
                            </span>

                            <h2 id="sectionSurahName">
                                -
                            </h2>

                        </div>

                        <div class="ayah-count">

                            <span>
                                عدد الآيات
                            </span>

                            <strong id="ayahCount">
                                -
                            </strong>

                        </div>

                    </div>


                    <div
                        id="ayahList"
                        class="ayah-list"
                    ></div>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <div class="container">

            <p>
                مصدر البيانات والصوت:
                <a
                    href="https://alquran.cloud/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Al Quran Cloud
                </a>
            </p>

        </div>

    </footer>


    <!-- =========================
         TOAST
    ========================== -->

    <div
        id="toast"
        class="toast"
    ></div>


    <script src="app.js"></script>

</body>

</html>
